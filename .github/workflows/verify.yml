name: Verify Phase 3
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROOF_DIR: docs/proof/phase-3/ci/core
      BROWSER_PROOF_DIR: docs/proof/phase-3/ci/browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: node --version && npm --version
      - run: npm ci
      - run: node scripts/preflight-ci.mjs
      # Replaced Phase-2 assertions are mapped in phase-3-test-plan.md;
      # retained physics/CLI/remediation assertions run in the unit suite.
      - run: node scripts/phase3-edge-scenarios.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/phase3-divergence.mjs
        env:
          RELEASE_DIR: docs/proof/phase-3/ci/runtime
          REQUIRE_GAMEPLAY_PARITY: '1'
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-3-verification
          path: docs/proof/phase-3/ci/
