name: Verify Phase 2
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: node --version && npm --version
      - run: npm ci
      - run: node scripts/preflight-ci.mjs
      - run: node scripts/run-phase2-qa.mjs
        env:
          PROOF_DIR: docs/proof/phase-2/core/ci/qa42
      - run: npm run bench:headless
        env:
          PROOF_DIR: docs/proof/phase-2/core/ci/benchmark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PROOF_DIR: docs/proof/phase-2/browser/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-platform-preflight
          path: docs/proof/phase-2/
