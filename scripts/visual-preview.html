<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual-only preview</title><style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1430}#scene canvas{display:block}</style></head><body><div id="scene"></div><script type="module">
import {createGame} from '../src/core/game.js';
import {browserView} from '../src/browser/presentation.js';
import {createRenderer} from '../src/browser/renderer.js';
const night=Number(new URLSearchParams(location.search).get('night')||1);
if(![1,2,3].includes(night))throw Error('invalid preview night');
const portrait=new URLSearchParams(location.search).get('portrait');
const game=createGame({night,seed:20261202}),view=browserView(game),renderer=createRenderer(document.querySelector('#scene'));
renderer.build(night);
let previous=0,frames=0,intervals=[];
const yaw=portrait==='back'?Math.PI:portrait==='side'?-Math.PI/2:portrait==='front'?0:night===2?-Math.PI/2:night===3?Math.PI:0;
function frame(now){renderer.update(view,now,yaw,portrait?4.5:21);if(previous)intervals.push(now-previous);previous=now;frames++;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__VISUAL_PREVIEW__={night,portrait,source:'Core initial state; render-only visual fixture',metrics:()=>({frames,intervals:intervals.slice(),drawCalls:renderer.renderer.info.render.calls,triangles:renderer.renderer.info.render.triangles,geometries:renderer.renderer.info.memory.geometries,textures:renderer.renderer.info.memory.textures,visuals:renderer.observe(),canvas:{width:renderer.renderer.domElement.width,height:renderer.renderer.domElement.height}})};
</script></body></html>
